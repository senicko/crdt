syntax = "proto3";

package crdt.v1;

import "google/protobuf/empty.proto";

message CreateVariableRequest {
  string var = 1;
  bytes crdt_bytes = 2;
}

message SyncStreamRequest {
  string var = 1;
  bytes crdt_bytes = 2;
}

message SyncStreamResponse {
  string var = 1;
  bytes crdt_bytes = 2;
}

service CrdtService {
  rpc CreateVariable(CreateVariableRequest) returns (google.protobuf.Empty);
  rpc SyncStream(stream SyncStreamRequest) returns (stream SyncStreamResponse);
}
