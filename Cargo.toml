[package]
name = "crdt"
version = "0.1.0"
edition = "2024"

[dependencies]
h2 = "0.4.14"
prost = "0.14.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
uuid = {version = "1.23.1", features = ["v4"]}
tonic = "0.14.6"
tonic-prost = "*"
bincode = "1.3.1"
serde = {version = "1.0", features=["derive"]}
uhlc = "0.8"
clap = "4.6.1"
clap-repl = "0.3.2"

[features]
default = []
server = []
client = []
full = ["server", "client"]

[build-dependencies]
tonic-prost-build = "*"

[[example]]
name = "crdt_server"
required-features = ["server"]

[[example]]
name = "crdt_client"
required-features = ["client"]
